# Dummy workflow only: tiny synthetic fixtures do not establish OCR accuracy.
# Official pretrained weights are SHA-verified and downloaded when training starts.
dataset_root: dummy_data/plates
output_dir: artifacts/dummy_fast_tiny
pretrained_dir: weights/pretrained
model: parseq-tiny
recipe: fast_tiny
image_size:
- 48
- 192
max_label_length: 12
normalization: upper_no_whitespace
warm_start_epochs: 1
warm_start_learning_rate: 0.0001
adaptation_epochs: 1
adaptation_learning_rate: 3.0e-05
epochs: 1
batch_size: 4
learning_rate: 3.0e-05
weight_decay: 0.01
synthetic_replay_ratio: 0.25
holdout_fraction: 0.2
split_seed: 15001
seed: 15001
num_workers: 0
precision: fp32
device: cpu
autoregressive: false
refinements: 2
refit_all_training: true
trt_precision: fp16
cuda_graph: true
