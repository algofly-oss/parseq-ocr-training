# Custom Fast Tiny recipe built on official PARSeq Tiny; not a separate upstream model.
dataset_root: dataset
output_dir: artifacts/parseq_fast_tiny
pretrained_dir: weights/pretrained
model: parseq-tiny
recipe: fast_tiny
image_size: [48, 192]  # final height, width; warm start/adaptation use 64x256
max_label_length: 12  # plus EOS; oversized labels raise an error
normalization: upper_no_whitespace
warm_start_epochs: 20
warm_start_learning_rate: 0.0001
adaptation_epochs: 5
adaptation_learning_rate: 0.00003
epochs: 5  # final smaller-input replay stage
batch_size: 64
learning_rate: 0.00003
weight_decay: 0.01
synthetic_replay_ratio: 0.25  # additional synthetic / real images = 20% effective batch
holdout_fraction: 0.1
split_seed: 20261113
seed: 20261114
num_workers: 4
precision: bf16
device: cuda
autoregressive: false
refinements: 2
refit_all_training: true
trt_precision: fp16  # encoder FP16 allowed; decoder/refinement constrained FP32
cuda_graph: true
