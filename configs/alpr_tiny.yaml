# Paths resolve relative to the repository root; no private dataset is bundled.
dataset_root: dataset
output_dir: artifacts/parseq_tiny
pretrained_dir: weights/pretrained
model: parseq-tiny  # Tiny: smaller model; standard recipe, not the separate fast-Tiny adaptation
image_size: [64, 256]  # height, width
normalization: none
epochs: 20
batch_size: 64
learning_rate: 0.0001
weight_decay: 0.01
holdout_fraction: 0.1
split_seed: 20261113
seed: 20261114
num_workers: 4
precision: bf16
device: cuda
autoregressive: true
refinements: 1
refit_all_training: true
