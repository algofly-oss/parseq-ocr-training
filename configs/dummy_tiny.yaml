# Dummy workflow only: tiny synthetic fixtures do not establish OCR accuracy.
# Official pretrained weights are SHA-verified and downloaded when training starts.
dataset_root: dummy_data/plates
output_dir: artifacts/dummy_tiny
pretrained_dir: weights/pretrained
model: parseq-tiny
image_size:
- 64
- 256
normalization: upper_no_whitespace
epochs: 1
batch_size: 4
learning_rate: 0.0001
weight_decay: 0.01
holdout_fraction: 0.2
split_seed: 15001
seed: 15001
num_workers: 0
precision: fp32
device: cpu
autoregressive: true
refinements: 1
refit_all_training: true
max_label_length: 12
